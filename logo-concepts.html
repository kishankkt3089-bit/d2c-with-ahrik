<!DOCTYPE html>
<html lang='en' data-theme='dark'>
<head>
    <meta charset='UTF-8'>
    <title>Logo Concepts</title>
    <link rel='stylesheet' href="style.css">
    <style>
        body { padding: 50px; background: var(--bg-primary); color: var(--text-primary); font-family: 'Inter', sans-serif; }
        .concept { margin-bottom: 60px; padding: 40px; background: var(--bg-secondary); border-radius: 16px; border: 1px solid var(--border-color); }
        .concept h2 { margin-bottom: 30px; font-size: 20px; color: var(--text-secondary); }
        .logo-wrapper { display: flex; align-items: center; gap: 15px; }
        
        /* Typography Logo */
        .logo-text-only { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; }
        .logo-text-only .d2c { background: linear-gradient(135deg, var(--text-gradient-1), var(--text-gradient-2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .logo-text-only .ahrik { font-weight: 300; letter-spacing: 2px; font-size: 20px; }

        /* Icon + Text Logo */
        .logo-icon { width: 40px; height: 40px; }
        .logo-text { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
    </style>
</head>
<body>
    <h1>Logo Concepts for Approval</h1>
    
    <div class='concept'>
        <h2>Concept 1: The Modern Typography (Sleek & Minimal)</h2>
        <div class='logo-wrapper'>
            <div class='logo-text-only'>
                <span class='d2c'>D2C</span> <span class='ahrik'>WITH AHRIK</span>
            </div>
        </div>
    </div>

    <div class='concept'>
        <h2>Concept 2: The Geometric Prism (Abstract 'A' + 'D')</h2>
        <div class='logo-wrapper'>
            <svg class='logo-icon' viewBox='0 0 100 100' fill='none' xmlns='http://www.w3.org/2000/svg'>
                <defs>
                    <linearGradient id='grad1' x1='0%' y1='0%' x2='100%' y2='100%'>
                        <stop offset='0%' stop-color='#c084fc' />
                        <stop offset='100%' stop-color='#f472b6' />
                    </linearGradient>
                    <linearGradient id='grad2' x1='100%' y1='0%' x2='0%' y2='100%'>
                        <stop offset='0%' stop-color='#6366f1' />
                        <stop offset='100%' stop-color='#a5b4fc' />
                    </linearGradient>
                </defs>
                <path d='M50 10 L90 90 L10 90 Z' fill='url(#grad1)' opacity='0.8' style='mix-blend-mode: screen;'/>
                <path d='M50 90 L90 10 L10 10 Z' fill='url(#grad2)' opacity='0.8' style='mix-blend-mode: screen;'/>
                <circle cx='50' cy='50' r='20' fill='#0f1115' />
            </svg>
            <div class='logo-text'>
                D2C WITH AHRIK
            </div>
        </div>
    </div>

    <div class='concept'>
        <h2>Concept 3: The Orbit (Reflecting the 3D Sphere animation)</h2>
        <div class='logo-wrapper'>
            <svg class='logo-icon' viewBox='0 0 100 100' fill='none' xmlns='http://www.w3.org/2000/svg'>
                <defs>
                    <linearGradient id='grad3' x1='0%' y1='0%' x2='100%' y2='100%'>
                        <stop offset='0%' stop-color='#6366f1' />
                        <stop offset='100%' stop-color='#f472b6' />
                    </linearGradient>
                </defs>
                <circle cx='50' cy='50' r='40' stroke='url(#grad3)' stroke-width='8' stroke-dasharray='60 20' />
                <circle cx='50' cy='50' r='20' fill='url(#grad3)' />
            </svg>
            <div class='logo-text'>
                D2C <span style='font-weight: 300'>WITH</span> AHRIK
            </div>
        </div>
    </div>
</body>
</html>
