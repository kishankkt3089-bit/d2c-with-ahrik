<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" shape-rendering="geometricPrecision">
  <defs>
    <!-- Background Gradient (Deep Luxury Dark) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1117" />
      <stop offset="50%" stop-color="#141824" />
      <stop offset="100%" stop-color="#090b0e" />
    </linearGradient>

    <!-- Main "A" Monogram Gradient (Vibrant Purple to Electric Cyan) -->
    <linearGradient id="aGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="40%" stop-color="#c084fc" />
      <stop offset="70%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Glowing Outer Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.95" />
    </linearGradient>

    <!-- Floating Orange Crossbar Accent Gradient -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7e00" />
      <stop offset="50%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ffb703" />
    </linearGradient>

    <!-- Soft Glow Filter for Monogram -->
    <filter id="glowA" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- High-Intensity Glow Filter for Floating Orange Pill -->
    <filter id="glowOrange" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur1" />
      <feGaussianBlur stdDeviation="4" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Rounded Container with Dark Theme Background & Glowing Gradient Border -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="12" />

  <!-- Inner Glass Shadow Ring for Depth -->
  <rect x="36" y="36" width="440" height="440" rx="100" fill="none" stroke="rgba(255, 255, 255, 0.06)" stroke-width="3" />

  <!-- Creative Stylized Monogram "A" with Inward Chevron Cutouts -->
  <path d="M 256 104 L 396 392 L 344 340 L 292 392 L 256 254 L 220 392 L 168 340 L 116 392 Z" 
        fill="url(#aGrad)" 
        filter="url(#glowA)" />

  <!-- Floating Glowing Orange Crossbar Pill Accent -->
  <rect x="216" y="294" width="80" height="15" rx="7.5" fill="url(#orangeGrad)" filter="url(#glowOrange)" />
</svg>
