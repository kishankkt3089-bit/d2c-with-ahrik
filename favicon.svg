<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1117" />
      <stop offset="50%" stop-color="#181c28" />
      <stop offset="100%" stop-color="#0a0c10" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#4ade80" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Background Ring -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bgGrad)" stroke="url(#brandGrad)" stroke-width="12" />
  
  <!-- Glowing Inner Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#accentGlow)" stroke-width="6" />

  <!-- D2C Text & Icon Monogram -->
  <g filter="url(#glow)">
    <!-- Letter D -->
    <path d="M 120 160 L 210 160 C 270 160, 310 195, 310 256 C 310 317, 270 352, 210 352 L 120 352 Z M 165 204 L 165 308 L 205 308 C 240 308, 260 288, 260 256 C 260 224, 240 204, 205 204 Z" fill="url(#brandGrad)" />
    
    <!-- AI Spark Stars -->
    <path d="M 360 140 L 368 165 L 393 173 L 368 181 L 360 206 L 352 181 L 327 173 L 352 165 Z" fill="#38bdf8" />
    <path d="M 380 320 L 385 335 L 400 340 L 385 345 L 380 360 L 375 345 L 360 340 L 375 335 Z" fill="#c084fc" />
  </g>
</svg>
